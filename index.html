<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini RTS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1d2a1a; }
  body { font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f2f5ea; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #top { top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; gap: 12px; align-items: center; font-weight: 800; font-size: 15px;
         background: #0d140bcc; padding: 6px 12px; border-radius: 12px; }
  #top small { font-weight: 600; opacity: .8; font-size: 12px; }
  #net { top: calc(max(8px, env(safe-area-inset-top)) + 40px); left: max(12px, env(safe-area-inset-left)); font-size: 12px; opacity: .8; }
  #msg { top: 26%; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 900; opacity: 0; transition: opacity .3s; }
  #msg small { display: block; font-size: 15px; font-weight: 700; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(600px, calc(100vw - 20px)); box-sizing: border-box;
           padding: 8px 10px; border-radius: 14px; background: #0f170dea; border: 1px solid #ffffff22; }
  #what { font-weight: 800; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  #what small { font-weight: 600; opacity: .8; }
  #acts { display: flex; flex-wrap: wrap; gap: 6px; }
  #acts button { flex: 1 1 0; min-width: 76px; min-height: 46px; border: 0; border-radius: 10px; background: #2c4226; color: #fff; font: 800 13px system-ui, sans-serif; cursor: pointer; padding: 3px 6px; }
  #acts button small { display: block; font-weight: 600; font-size: 11px; opacity: .85; }
  #acts button.on { background: #ffd166; color: #2a1a00; }
  #acts button:disabled { opacity: .4; cursor: default; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b120ac0; }
  #over[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 90vh; overflow: auto; padding: 20px; border-radius: 16px; background: #1b2a17; border: 1px solid #ffffff26; text-align: center; }
  .card h2 { margin: 0; font-size: 25px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #b5e08a; text-align: left; }
  .card p { margin: 6px 0; font-size: 14px; opacity: .85; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; } .card li span { float: right; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1a00; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 520px) { #top { font-size: 13px; gap: 8px; padding: 5px 9px; } #acts button { min-width: 64px; font-size: 12px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"></div>
<div class="hud" id="net">Connecting…</div>
<div class="hud" id="msg"></div>
<div id="panel"><div id="what"></div><div id="acts"></div></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most kills in a match</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">New match</button><p id="overNext"></p>
</div></div>
<script>
/* ═══ MINI RTS · a Multiplayer Agent starter ═════════════════════════════════════════
 * Gather, build, train, crush the other bases. Versus, 2–4 players; bots run every base
 * nobody plays.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ map size, costs, the unit and building types (and who beats whom)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... where the bases, gold mines and trees are (the same every match)
 *   SIM (HOST) .... the whole battle: gathering, building, training, moving, fighting.
 *                   Only the host runs it and writes the shared fields.
 *   COMMANDS ...... what a player can order (move, attack, gather, build, train), checked by the host
 *   BOTS (HOST) ... build order, workers, counters and attack waves
 *   VIEW .......... reading the battle back from state, for everyone who isn't host
 *   DRAW .......... camera, ground, resources, buildings, units, arrows, minimap
 *   HUD & PANEL ... resources, the selection panel's buttons, results, leaderboard
 *   INPUT ......... select (click, drag a box, tap), command (right-click, tap), camera
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the battle):
 *   - `match` (ONE shared JSON field, host-only): {id, v, ph: play|over, at, end, win,
 *     seats [4 bases] each {w: who ("" = bot), n, c, out}}. `v` goes up on every write.
 *   - `u0`…`u3` (host, ~7/s): each base's units, packed [id, type, x, y, hp, action, target,
 *     attack count, order, carrying]. `b0`…`b3` (host, on change): gold, wood, kills and the
 *     buildings [id, type, x, y, hp, built %, training queue, queue start, shots, target].
 *     `res` (host): what's left in every mine and tree. A new host adopts all of it.
 *   - Each player writes only `n`/`c` (name, color) and `hb` (heartbeat).
 *   - Players send intents to the host: "cmd" {k: go|stop|train|build, u: unit ids, x, y,
 *     tg (target id), r (resource), b (building), t (type)}. The host checks you own the units,
 *     can pay and the spot is free, then sets each unit's order.
 *   - Everyone else draws the units eased between snapshots.
 *   - ?attract plays offline with four bot bases (the preview video is recorded from it).
 *   - Leaderboard "most-kills": the most enemy units and buildings each player's base destroyed.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  map: 1500,            // the map is map × map world px
  seats: 4,             // bases on the map (bots run the ones nobody plays)
  startGold: 150, startWood: 100, startWorkers: 4,
  unitCap: 30,          // most units a base can have (counting the queue)
  carry: 8,             // what a worker carries per trip
  gatherMs: 1400,       // time to dig or chop one load
  aggro: 170,           // how far idle soldiers look for a fight
  buildRange: 420,      // new buildings go within this distance of your own buildings
  sendMs: 140,          // the host sends units ~7 times a second
  matchMs: 600000,      // after 10 minutes the strongest base wins
  resultsMs: 15000,     // the results show this long, then a new match starts
  firstWave: 6,         // bots attack when their army is this big (and +2 each wave)...
  calmMs: 150000,       // ...but not in the first 2.5 minutes, so new players can build up
  seatGraceMs: 10000,   // a player silent this long hands its base to a bot
  board: "most-kills",
};
// beats = the type it deals double damage to (and takes less from): Spearman > Rider > Archer > Spearman.
const UNITS = [
  { n: "Worker", hp: 40, dmg: 4, range: 4, cd: 1.0, speed: 74, r: 9, gold: 50, wood: 0, time: 4, beats: -1, key: "Q" },
  { n: "Spearman", hp: 90, dmg: 10, range: 6, cd: 1.0, speed: 66, r: 10, gold: 60, wood: 20, time: 6, beats: 3, key: "Q" },
  { n: "Archer", hp: 60, dmg: 9, range: 140, cd: 1.2, speed: 70, r: 10, gold: 50, wood: 40, time: 7, beats: 1, key: "W" },
  { n: "Rider", hp: 110, dmg: 13, range: 6, cd: 1.1, speed: 108, r: 12, gold: 80, wood: 40, time: 8, beats: 2, key: "E" },
];
const BUILDS = [
  { n: "Town Hall", hp: 1500, r: 42, gold: 0, wood: 0, time: 0, trains: [0], range: 170, dmg: 5, cd: 1.2 },
  { n: "Barracks", hp: 600, r: 32, gold: 100, wood: 120, time: 14, trains: [1, 2, 3], key: "Q" },
  { n: "Tower", hp: 450, r: 20, gold: 75, wood: 100, time: 10, trains: [], range: 220, dmg: 14, cd: 1.0, key: "W" },
];
const COLORS = ["#4da6ff", "#ff5a5a", "#ffd23f", "#c77dff", "#52d273", "#ff8c42", "#ff6fb5", "#3de0d0"];
const BOT_NAMES = ["Iron Duke", "Red Baron", "Sun Queen", "Violet King"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'mini-rts',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { startGold: 900, startWood: 900, firstWave: 4, calmMs: 0, resultsMs: 1500 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} }, joinedAt = 0;
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). `as` names a mapped view of it. */
function shared(key, fallback, map = (v) => v, as = "") {
  const raw = S.shared[key], m = memo.get(key + as);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback)); memo.set(key + as, { raw, v }); return v;
}
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── MAP ─────────────────────────────────────────────────────────────────────────────
const MS = CONFIG.map, MID = { x: MS / 2, y: MS / 2 };
const BASES = [[240, 240], [MS - 240, MS - 240], [MS - 240, 240], [240, MS - 240]]; // seats 0 and 1 face each other across the map
/** Every gold mine and tree: one mine and a grove by each base, a rich mine and four groves in the middle. */
const RES = (() => {
  const out = [];
  BASES.forEach(([x, y]) => {
    const sx = x < MS / 2 ? 1 : -1, sy = y < MS / 2 ? 1 : -1;
    out.push({ k: "g", x: x + sx * 195, y: y - sy * 85, r: 26, amt: 1600 });
    for (let i = 0; i < 6; i++) out.push({ k: "w", x: x - sx * 80 + sx * i * 30, y: y + sy * 195 + (i % 2) * 24 * sy, r: 14, amt: 200 });
  });
  out.push({ k: "g", x: MID.x, y: MID.y, r: 34, amt: 3000 });
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) for (let i = 0; i < 3; i++) out.push({ k: "w", x: MID.x + dx * 230 + dy * (i - 1) * 30, y: MID.y + dy * 230 + dx * (i - 1) * 30, r: 14, amt: 200 });
  return out;
})();
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);

// ── SIM (HOST) ──────────────────────────────────────────────────────────────────────
// host.f[k] = { g, w, kills, b: [buildings], u: [units] } for each base; host.amt = what's left in each resource.
const host = { wasHost: false, last: null, f: [], amt: [], nextId: 1, lastU: 0, dirtyB: [true, true, true, true], dirtyRes: true, lastRes: 0, cmds: [], botAt: 0, waves: [0, 0, 0, 0], again: false };
function match() {
  const m = shared("match", null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: Math.max(host.last?.v ?? 0, shared("match", null)?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const newUnit = (t, x, y, o) => ({ id: host.nextId++, t, x, y, hp: UNITS[t].hp, ord: "", cr: 0, cd: 0, sw: 0, tg: 0, a: 0, ht: 0, o });
const newBuilding = (t, x, y, o, built) => ({ id: host.nextId++, t, x, y, hp: built ? BUILDS[t].hp : Math.round(BUILDS[t].hp * 0.1), bp: built ? 100 : 0, q: "", qs: 0, cd: 0, sw: 0, tg: 0, o });
/** A fresh map: every base gets its hall and workers (the preview's bases start with a barracks, a tower and soldiers on the way). */
function newBattle() {
  host.f = BASES.map(([x, y], k) => {
    const sx = x < MS / 2 ? 1 : -1, sy = y < MS / 2 ? 1 : -1, f = { g: CONFIG.startGold, w: CONFIG.startWood, kills: 0, b: [newBuilding(0, x, y, k, true)], u: [] };
    for (let i = 0; i < CONFIG.startWorkers; i++) { const u = newUnit(0, x + sx * (60 + i * 18), y - sy * 30 + i * 6, k); u.ord = "g" + RES.findIndex((r) => r.k === (i === CONFIG.startWorkers - 1 ? "w" : "g") && Math.hypot(r.x - x, r.y - y) < 300); f.u.push(u); } // three dig gold, one chops wood
    if (ATTRACT) {
      f.b.push(newBuilding(1, x + sx * 110, y + sy * 90, k, true), newBuilding(2, x + sx * 170, y + sy * 170, k, true));
      // the preview: two armies march on base 0 (top left), which defends; the camera watches that base
      const [ax, ay, to] = [[330, 470, null], [MID.x, MID.y, MID], [880, 300, { x: 260, y: 300 }], [270, 860, { x: 300, y: 330 }]][k];
      for (let i = 0; i < 7; i++) { const u = newUnit(1 + (i % 3), ax + rnd(-45, 45), ay + rnd(-45, 45), k); if (to) u.ord = `A${Math.round(to.x + rnd(-40, 40))},${Math.round(to.y + rnd(-40, 40))}`; f.u.push(u); }
    }
    return f;
  });
  host.amt = RES.map((r) => r.amt);
  host.dirtyB = [true, true, true, true]; host.dirtyRes = true; host.waves = [0, 0, 0, 0];
}
/** Become host: take over the battle exactly as state has it. */
function adopt() {
  host.last = null;
  if (!shared("b0", null)) { host.f = []; return; } // no battle in state yet: hostTick starts one
  host.f = [0, 1, 2, 3].map((k) => {
    const b = shared("b" + k, null), u = shared("u" + k, []);
    return { g: b?.g ?? 0, w: b?.w ?? 0, kills: b?.kl ?? 0,
      b: (b?.b || []).map(([id, t, x, y, hp, bp, q, qs, sw, tg]) => ({ id, t, x, y, hp, bp, q: String(q || ""), qs, cd: 0, sw, tg, o: k })),
      u: u.map(([id, t, x, y, hp, a, tg, sw, ord, cr]) => ({ id, t, x, y, hp, a, tg, sw, ord: String(ord || ""), cr, cd: 0, ht: 0, o: k })) };
  });
  const amt = shared("res", null);
  host.amt = Array.isArray(amt) && amt.length === RES.length ? amt.slice() : RES.map((r) => r.amt);
  host.nextId = 1 + Math.max(0, ...host.f.flatMap((f) => [...f.b.map((b) => b.id), ...f.u.map((u) => u.id)]));
  host.dirtyB = [true, true, true, true];
}
const isDone = (b) => b.bp >= 100;
/** The damage one attack does: double against the type it beats, less against the type that beats it. */
function damage(a, t, isBuilding) {
  if (a.isB) return BUILDS[a.t].dmg;
  const A = UNITS[a.t];
  if (isBuilding) return A.dmg * (a.t === 0 ? 0.6 : a.t === 2 ? 0.7 : 1);
  return A.dmg * (A.beats === t.t ? 2 : 1) * (UNITS[t.t].beats === a.t ? 0.6 : 1);
}
function simTick(dt, now) {
  const m = match();
  const all = [], blds = [], byId = new Map();
  host.f.forEach((f, k) => { for (const u of f.u) { u.o = k; all.push(u); byId.set(u.id, u); } for (const b of f.b) { b.o = k; b.isB = true; blds.push(b); byId.set(b.id, b); } });
  const enemyNear = (o, x, y, range, unitsFirst) => {
    let best = null, bd = range;
    for (const u of all) if (u.o !== o && u.hp > 0) { const d = Math.hypot(u.x - x, u.y - y) - UNITS[u.t].r; if (d < bd) { bd = d; best = u; } }
    if (best && unitsFirst) return best;
    for (const b of blds) if (b.o !== o && b.hp > 0) { const d = Math.hypot(b.x - x, b.y - y) - BUILDS[b.t].r; if (d < bd) { bd = d; best = b; } }
    return best;
  };
  const hit = (a, t) => {
    t.hp -= damage(a, t, !!t.isB);
    if (t.hp <= 0 && !t.dead) { t.dead = true; if (t.o !== a.o) host.f[a.o].kills++; host.dirtyB[a.o] = true; }
  };
  // training: the first unit in each queue pops out when its time is up
  for (const b of blds) if (isDone(b) && b.q.length) {
    const t = +b.q[0];
    if (now - b.qs >= UNITS[t].time * 1000) {
      const a = Math.atan2(MID.y - b.y, MID.x - b.x) + rnd(-0.6, 0.6), u = newUnit(t, b.x + Math.cos(a) * (BUILDS[b.t].r + 14), b.y + Math.sin(a) * (BUILDS[b.t].r + 14), b.o);
      if (t === 0) u.ord = autoGather(u); else if (m.seats[b.o].w === "") u.ord = "";
      host.f[b.o].u.push(u); all.push(u); byId.set(u.id, u);
      b.q = b.q.slice(1); b.qs = now; host.dirtyB[b.o] = true;
    }
  }
  // towers and halls shoot the nearest enemy unit in range
  for (const b of blds) {
    const B = BUILDS[b.t];
    if (!B.dmg || !isDone(b)) continue;
    b.cd -= dt;
    if (b.cd > 0) continue;
    const e = enemyNear(b.o, b.x, b.y, B.range, true);
    if (e && !e.isB) { b.cd = B.cd; b.sw++; b.tg = e.id; hit(b, e); host.dirtyB[b.o] = true; } else b.tg = 0;
  }
  // every unit follows its order
  for (const u of all) if (u.hp > 0) unitTick(u, dt, byId, enemyNear, hit);
  // bodies push apart, and out of buildings, mines and trees
  for (let i = 0; i < all.length; i++) {
    const a = all[i], ra = UNITS[a.t].r;
    for (let j = i + 1; j < all.length; j++) {
      const b = all[j], dx = b.x - a.x, dy = b.y - a.y, min = ra + UNITS[b.t].r;
      if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
      const d = Math.hypot(dx, dy) || 0.01;
      if (d < min) { const push = (min - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
    }
    for (const o of blds) pushOut(a, o.x, o.y, BUILDS[o.t].r + ra);
    for (let n = 0; n < RES.length; n++) if (host.amt[n] > 0) pushOut(a, RES[n].x, RES[n].y, RES[n].r + ra - 4);
    a.x = Math.max(ra, Math.min(MS - ra, a.x)); a.y = Math.max(ra, Math.min(MS - ra, a.y));
  }
  // the dead are removed; a base that lost its last Town Hall is out
  let out = null;
  host.f.forEach((f, k) => {
    const before = f.b.length; f.u = f.u.filter((u) => u.hp > 0); f.b = f.b.filter((b) => b.hp > 0);
    if (f.b.length !== before) host.dirtyB[k] = true;
    if (!m.seats[k].out && !f.b.some((b) => b.t === 0)) { f.u = []; f.b = []; host.dirtyB[k] = true; (out ||= []).push(k); }
  });
  if (out) writeMatch({ ...match(), seats: match().seats.map((s, k) => (out.includes(k) ? { ...s, out: 1 } : s)) });
}
function pushOut(u, x, y, min) {
  const dx = u.x - x, dy = u.y - y, d = Math.hypot(dx, dy);
  if (d < min) { const nx = d ? dx / d : 1, ny = d ? dy / d : 0; u.x = x + nx * min; u.y = y + ny * min; }
}
/** Walk toward a point; a little sideways when something blocks the way. */
function moveToward(u, x, y, step) {
  const dx = x - u.x, dy = y - u.y, d = Math.hypot(dx, dy);
  if (d < 0.5) return;
  const s = Math.min(d, step); u.x += (dx / d) * s; u.y += (dy / d) * s;
}
/** The nearest node of a kind with something left in it, for a worker. */
function nearestNode(k, u, max = 1e9) {

  for (let n = 0; n < RES.length; n++) if (amt[n] > 0 && Math.hypot(RES[n].x - p.x, RES[n].y - p.y) < RES[n].r + slop) return { kind: "res", r: n };

}
/** Left-click / tap on something: select it (yours) or, with units selected, send them there (tap commands on touch). */
function selectAt(sx, sy, add, touch) {
  const hit = pickAt(sx, sy);
  if (hit.mine && hit.kind === "unit") { if (!add) { sel.ids.clear(); sel.bld = 0; } sel.ids.add(hit.id); sfx("select"); return; }
  if (hit.mine && hit.kind === "bld" && !(touch && sel.ids.size && !hit.done)) { sel.ids.clear(); sel.bld = hit.id; sfx("select"); return; }
  if (touch && sel.ids.size) { orderAt(sx, sy); return; }
  sel.ids.clear(); sel.bld = 0;
}
/** Right-click / tap with units selected: attack an enemy, gather a resource, help build, or go there. */
function orderAt(sx, sy) {
  if (!sel.ids.size) return;
  const hit = pickAt(sx, sy), p = toWorld(sx, sy);
  const c = { k: "go", u: [...sel.ids], x: Math.round(p.x), y: Math.round(p.y) };
  if ((hit.kind === "unit" || hit.kind === "bld") && !hit.mine) c.tg = hit.id;
  if (hit.kind === "bld" && hit.mine) c.tg = hit.id;
  if (hit.kind === "res") c.r = hit.r;
  command(c);
  pings.push({ x: p.x, y: p.y, t: performance.now(), color: c.tg && !hit.mine ? "#ff5a5a" : "#7dff8a" });
  sfx(c.tg && !hit.mine ? "attack" : "go");
}
function placeAt(sx, sy) {
  const p = toWorld(sx, sy), k = mySeat(), workers = unitsOf(k).filter((u) => u.t === 0 && sel.ids.has(u.id));
  const list = workers.length ? workers : unitsOf(k).filter((u) => u.t === 0).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y)).slice(0, 1);
  if (!canPlace(k, place.t, p.x, p.y, [0, 1, 2, 3].map((j) => baseOf(j)), amounts())) { banner("Can't build there", "Pick a clear spot near your buildings"); return; }
  command({ k: "build", t: place.t, u: list.map((u) => u.id), x: Math.round(p.x), y: Math.round(p.y) });
  pings.push({ x: p.x, y: p.y, t: performance.now(), color: "#ffd166" });
  place = null;
}
function boxSelect() {
  const a = toWorld(Math.min(box.x0, box.x1), Math.min(box.y0, box.y1)), b = toWorld(Math.max(box.x0, box.x1), Math.max(box.y0, box.y1));
  const inside = unitsOf(mySeat()).filter((u) => { const v = views.get(u.id) || u; return v.x >= a.x && v.x <= b.x && v.y >= a.y && v.y <= b.y; });
  const army = inside.filter((u) => u.t > 0);
  sel.ids = new Set((army.length ? army : inside).map((u) => u.id)); sel.bld = 0;
  if (inside.length) sfx("select");
}
const inMini = (x, y) => mini && x >= mini.x0 && y >= mini.y0 && x <= mini.x0 + mini.size && y <= mini.y0 + mini.size;
function miniJump(x, y) { cam.x = ((x - mini.x0) / mini.size) * MS; cam.y = ((y - mini.y0) / mini.size) * MS; clampCam(); }
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  try { audio ||= new AudioContext(); } catch {}
  if (inMini(e.clientX, e.clientY)) { miniJump(e.clientX, e.clientY); touches.set(e.pointerId, { mini: true }); return; }
  if (e.pointerType === "mouse") {
    if (e.button === 2) { if (place) place = null; else orderAt(e.clientX, e.clientY); return; }
    if (e.button === 1) { touches.set(e.pointerId, { x: e.clientX, y: e.clientY, pan: true }); return; }
    if (place) { placeAt(e.clientX, e.clientY); return; }
    box = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY, mouse: true };
    return;
  }
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false });
  if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; box = null; }
  else if (boxMode) box = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY };
});
let pinch = null;
cv.addEventListener("pointermove", (e) => {
  pointer.world = toWorld(e.clientX, e.clientY);
  const t = touches.get(e.pointerId);
  if (box && (e.pointerType === "mouse" ? box.mouse : t)) { box.x1 = e.clientX; box.y1 = e.clientY; if (t) t.moved = true; return; }
  if (!t) return;
  if (t.mini) { miniJump(e.clientX, e.clientY); return; }
  const dx = e.clientX - t.x, dy = e.clientY - t.y;
  t.x = e.clientX; t.y = e.clientY;
  if (Math.hypot(e.clientX - (t.x0 ?? e.clientX), e.clientY - (t.y0 ?? e.clientY)) > 10) t.moved = true;
  if (pinch && touches.size === 2) { const [a, b] = [...touches.values()]; cam.z = Math.max(0.35, Math.min(2.2, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)); }
  if (t.pan || e.pointerType === "touch") { cam.x -= dx / cam.z / (touches.size || 1); cam.y -= dy / cam.z / (touches.size || 1); }
  clampCam();
});
function pointerEnd(e) {
  const t = touches.get(e.pointerId);
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (e.pointerType === "mouse" && box && box.mouse && e.button === 0) {
    if (Math.hypot(box.x1 - box.x0, box.y1 - box.y0) < 6) selectAt(e.clientX, e.clientY, e.shiftKey, false); else boxSelect();
    box = null; return;
  }
  if (!t || t.mini || e.pointerType === "mouse") return;
  if (box) { if (Math.hypot(box.x1 - box.x0, box.y1 - box.y0) > 12) boxSelect(); box = null; boxMode = false; if (t.moved) return; }
  if (t.moved || e.type === "pointercancel") return;
  if (place) placeAt(e.clientX, e.clientY); else selectAt(e.clientX, e.clientY, false, true);
}
cv.addEventListener("pointerup", pointerEnd); cv.addEventListener("pointercancel", pointerEnd);
cv.addEventListener("wheel", (e) => { e.preventDefault(); const before = toWorld(e.clientX, e.clientY); cam.z = Math.max(0.35, Math.min(2.2, cam.z * (e.deltaY > 0 ? 0.9 : 1.1))); const after = toWorld(e.clientX, e.clientY); cam.x += before.x - after.x; cam.y += before.y - after.y; clampCam(); }, { passive: false });
addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase(); keys.add(key);
  if (key === "escape") { place = null; sel.ids.clear(); sel.bld = 0; }
  const [, acts] = panelButtons(match() || { seats: [] });
  const hot = { 1: 0, 2: 1, 3: 2 }[key];
  if (hot !== undefined && acts[hot] && !acts[hot][3] && !acts[hot][0].match(/army|idle|hall/)) doAction(acts[hot][0]);
  if (key === " ") { e.preventDefault(); doAction("army"); }
  if (key === "i") doAction("idle");
  if (key === "h") doAction("hall");
  if (key === "x" && sel.ids.size) doAction("stop");
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
function panKeys(dt) {
  const v = 700 / cam.z * dt;
  if (keys.has("a") || keys.has("arrowleft")) cam.x -= v;
  if (keys.has("d") || keys.has("arrowright")) cam.x += v;
  if (keys.has("w") || keys.has("arrowup")) cam.y -= v;
  if (keys.has("s") || keys.has("arrowdown")) cam.y += v;
  clampCam();
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** Two people in one color (or a person in a bot's color): the one with the higher sessionId picks a free color. */
let myColor = COLORS[0];
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Brave", "Clever", "Sunny", "Swift", "Lucky", "Mighty"][Math.floor(Math.random() * 6)] + " " + ["Otter", "Fox", "Badger", "Owl", "Panda", "Llama"][Math.floor(Math.random() * 6)];
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = (match()?.seats || []).filter((s) => !s.w).map((s) => s.c);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}
let last = performance.now(), lastHb = 0, lastHud = 0, camSet = -1;
/** The preview's camera watches the first base and follows the fighting near it. */
function attractCam(dt) {
  let sx = 0, sy = 0, n = 0;
  for (let k = 0; k < 4; k++) for (const u of unitsOf(k)) if (u.a === 1 && Math.hypot(u.x - BASES[0][0], u.y - BASES[0][1]) < 520) { sx += u.x; sy += u.y; n++; }
  const tx = n ? (sx / n + 2 * 380) / 3 : 380, ty = n ? (sy / n + 2 * 330) / 3 : 330;
  cam.z = Math.min(W, H) / 400;

}
function frame(now) {

  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;

  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt); else { host.wasHost = false; host.last = null; host.cmds = []; }
  const m = match();
  if (!m) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#1d2a1a"; ctx.fillRect(0, 0, W, H); return; }
  const k = mySeat();
  if (camSet !== m.id + "." + k && k >= 0) { const h = baseOf(k).b.find((b) => b.t === 0); if (h) { camSet = m.id + "." + k; cam.x = h.x; cam.y = h.y; cam.z = Math.min(1.4, Math.max(0.8, Math.min(W, H) / (W < 600 ? 440 : 520))); sel.ids.clear(); sel.bld = 0; place = null; clampCam(); } }
  if (k < 0 && camSet !== "watch" && !ATTRACT) { camSet = "watch"; cam.x = MID.x; cam.y = MID.y; cam.z = Math.min(W, H) / (MS * 0.95); clampCam(); }
  if (ATTRACT) attractCam(dt); else panKeys(dt);
  if (k >= 0) { const alive = new Set(unitsOf(k).map((u) => u.id)); for (const id of sel.ids) if (!alive.has(id)) sel.ids.delete(id); if (sel.bld && !baseOf(k).b.some((b) => b.id === sel.bld)) sel.bld = 0; }
  draw(m, dt);
  if (now - lastHud > 150) { lastHud = now; hud(m); }
}

(async function start() {
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("cmd", (c, from) => { if (isHost() && c) host.cmds.push([from, c]); });
  net.on("again", () => { if (isHost()) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  joinedAt = performance.now();
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(shared("match", null)?.seats || []).map((s) => s.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
